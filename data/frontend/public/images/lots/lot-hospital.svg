<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_lot-" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="60%" stop-color="#fee2e2"/>
      <stop offset="100%" stop-color="#fecaca"/>
    </linearGradient>
    <filter id="shadow_lot-" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  
  <!-- Card Background -->
  <rect width="400" height="220" rx="16" fill="url(#bg_lot-)"/>
  
  <!-- Geometric Structure Motif -->
  <g opacity="0.45">
    <line x1="0" y1="140" x2="400" y2="140" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 4"/>
    <line x1="120" y1="0" x2="120" y2="220" stroke="#dc2626" stroke-width="1" opacity="0.3"/>
    <line x1="280" y1="0" x2="280" y2="220" stroke="#dc2626" stroke-width="1" opacity="0.3"/>
    <!-- Parking Bays -->
    <rect x="40" y="155" width="45" height="50" rx="4" fill="none" stroke="#dc2626" stroke-width="2"/>
    <rect x="95" y="155" width="45" height="50" rx="4" fill="none" stroke="#dc2626" stroke-width="2"/>
    <rect x="150" y="155" width="45" height="50" rx="4" fill="none" stroke="#dc2626" stroke-width="2"/>
    <rect x="205" y="155" width="45" height="50" rx="4" fill="#dc2626" fill-opacity="0.2" stroke="#dc2626" stroke-width="2"/>
    <rect x="260" y="155" width="45" height="50" rx="4" fill="none" stroke="#dc2626" stroke-width="2"/>
    <rect x="315" y="155" width="45" height="50" rx="4" fill="none" stroke="#dc2626" stroke-width="2"/>
  </g>

  <!-- Central Building Icon Container -->
  <g transform="translate(40, 45)">
    <rect width="52" height="52" rx="12" fill="#ffffff" filter="url(#shadow_lot-)"/>
    <!-- Facility P Sign & Building Badge -->
    <rect x="10" y="10" width="32" height="32" rx="8" fill="#dc2626"/>
    <text x="26" y="32" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900">P</text>
  </g>

  <!-- Facility Title & Badge -->
  <g transform="translate(108, 55)">
    <rect x="0" y="0" width="160" height="22" rx="11" fill="#ffffff" filter="url(#shadow_lot-)"/>
    <circle cx="10" cy="11" r="4" fill="#dc2626"/>
    <text x="22" y="15" fill="#dc2626" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Hospital Priority Zone</text>
    <text x="0" y="42" fill="#0f172a" font-family="system-ui, sans-serif" font-size="16" font-weight="800">Manipal Emergency & OPD Deck</text>
  </g>

  <!-- Live Verified Badge -->
  <g transform="translate(320, 25)">
    <rect x="-35" y="-10" width="70" height="22" rx="11" fill="#059669"/>
    <text x="0" y="5" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700">VERIFIED</text>
  </g>
</svg>